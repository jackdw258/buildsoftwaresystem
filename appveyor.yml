
# Build Fembimmo Display on a hosted Windows machine
image: Visual Studio 2022

version: 1.1.{build}

environment:
  PYTHON: 'C:\Python311-x64'

install:
  - cmd: '"%PYTHON%\python.exe" --version'
  - cmd: '"%PYTHON%\python.exe" -m pip install --upgrade pip'
  - cmd: '"%PYTHON%\python.exe" -m pip install --upgrade "pywebview[qt]" qtpy PyQt6 PyQt6-WebEngine segno certifi pyinstaller pyinstaller-hooks-contrib'
  - cmd: '"%PYTHON%\python.exe" -m pip check'
  - ps: |
      $hook = @'
      import os
      import re
      import sys

      for name in (
          "QT_PLUGIN_PATH",
          "QT_QPA_PLATFORM_PLUGIN_PATH",
          "QT_QPA_FONTDIR",
          "QML2_IMPORT_PATH",
          "QML_IMPORT_PATH",
          "QT_CONF_PATH",
          "PYTHONPATH",
          "PYTHONHOME",
      ):
          os.environ.pop(name, None)

      internal = os.path.normcase(os.path.abspath(
          getattr(sys, "_MEIPASS", "")
      ))
      cleaned = []

      for entry in os.environ.get("PATH", "").split(os.pathsep):
          if not entry:
              continue
          absolute = os.path.normcase(os.path.abspath(entry))
          try:
              if internal and os.path.commonpath(
                  [internal, absolute]
              ) == internal:
                  cleaned.append(entry)
                  continue
          except (ValueError, OSError):
              pass

          normalized = entry.replace("/", "\\").lower()
          foreign_qt = bool(re.search(
              r"\\(?:qt(?:\d|\\)|pyqt\d*\\qt\d*\\)",
              normalized
          ))
          if not foreign_qt:
              cleaned.append(entry)

      os.environ["PATH"] = os.pathsep.join(cleaned)
      '@
      Set-Content -Path 'rthook_clean_qt_env.py' -Value $hook -Encoding UTF8

build_script:
  - cmd: >-
      "%PYTHON%\python.exe" -m PyInstaller --noconfirm --clean --onedir --console
      --name FembimmoDisplay
      --runtime-hook rthook_clean_qt_env.py
      --collect-all webview
      --collect-all qtpy
      --collect-all PyQt6
      --collect-all segno
      --collect-all certifi
      --hidden-import=webview.platforms.qt
      --hidden-import=PyQt6.QtWebEngineWidgets
      --hidden-import=PyQt6.QtWebEngineCore
      --hidden-import=PyQt6.QtWebChannel
      main.py

  - ps: |
      $ErrorActionPreference = 'Stop'
      $exe = Join-Path $PWD 'dist\FembimmoDisplay\FembimmoDisplay.exe'

      if (-not (Test-Path $exe)) {
        throw 'PyInstaller did not produce FembimmoDisplay.exe'
      }

      Write-Host 'Python Qt package versions:'
      & "$env:PYTHON\python.exe" -m pip show PyQt6 PyQt6-Qt6 PyQt6-WebEngine PyQt6-WebEngine-Qt6

      $diagnose = & $exe --diagnose 2>&1
      $exitCode = $LASTEXITCODE
      $diagnose | ForEach-Object { Write-Host $_ }

      if ($exitCode -ne 0) {
        throw "The diagnostic command failed with exit code $exitCode."
      }

      if (($diagnose -join "`n") -notmatch 'Qt WebEngine: OK') {
        throw 'Qt WebEngine test failed. Check the log for DLL errors.'
      }

      $zip = Join-Path $PWD 'dist\FembimmoDisplay-Windows-x64.zip'
      Compress-Archive -Path (Join-Path (Split-Path $exe -Parent) '*') -DestinationPath $zip -Force

      if (-not (Test-Path $zip)) {
        throw 'The portable app ZIP was not created.'
      }

artifacts:
  - path: dist/FembimmoDisplay-Windows-x64.zip
    name: FembimmoDisplay-Windows-x64
